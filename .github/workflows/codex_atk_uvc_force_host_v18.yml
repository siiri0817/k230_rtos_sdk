name: Build ATK-DNK230D CanMV v1.8 forced USB0 UVC host

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash

    steps:
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison flex gcc g++ libncurses-dev pkg-config libconfuse-dev \
            libssl-dev python3 python3-pip python3-venv cmake libyaml-dev \
            scons mtools bzip2 rsync wget git
          python3 -m venv "$HOME/.canmv_venv"
          source "$HOME/.canmv_venv/bin/activate"
          pip install pycryptodome gmssl jsonschema jinja2 toml kconfiglib

      - name: Sync exact CanMV v1.8 source manifest
        run: |
          mkdir -p "$HOME/.bin" "$GITHUB_WORKSPACE/canmv_v18"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/.bin/repo"
          chmod +x "$HOME/.bin/repo"
          cd "$GITHUB_WORKSPACE/canmv_v18"
          "$HOME/.bin/repo" init \
            -u https://github.com/canmv-k230/manifest.git \
            -m canmv_v1.8.xml \
            --repo-url=https://github.com/canmv-k230/git-repo.git \
            --repo-branch=stable
          "$HOME/.bin/repo" sync -c -j8
          "$HOME/.bin/repo" manifest -r -o resolved_manifest.xml

      - name: Configure ATK USB0 as a dedicated UVC host
        working-directory: canmv_v18
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_options(path, remove_keys, options):
              p = Path(path)
              lines = p.read_text().splitlines()
              lines = [
                  line for line in lines
                  if not any(line.startswith(key + "=") for key in remove_keys)
              ]
              lines.extend(options)
              p.write_text("\n".join(lines) + "\n")

          replace_options(
              "configs/k230d_canmv_atk_dnk230d_defconfig",
              {"CONFIG_ENABLE_UVC_CAMERA", "CONFIG_USBHOST_MAX_VIDEO_CLASS"},
              [
                  "CONFIG_ENABLE_UVC_CAMERA=y",
                  "CONFIG_USBHOST_MAX_VIDEO_CLASS=1",
              ],
          )
          replace_options(
              "src/rtsmart/rtsmart/kernel/bsp/maix3/configs/k230d_canmv_atk_dnk230d_defconfig",
              {
                  "CONFIG_ENABLE_CHERRY_USB_OTG",
                  "CONFIG_CHERRY_USB_OTG_USING_DEV0",
                  "CONFIG_CHERRY_USB_OTG_USING_DEV1",
                  "CONFIG_ENABLE_CHERRY_USB_DEVICE",
                  "CONFIG_CHERRY_USB_DEVICE_USING_DEV0",
                  "CONFIG_CHERRY_USB_DEVICE_USING_DEV1",
                  "CONFIG_ENABLE_CHERRY_USB_HOST",
                  "CONFIG_CHERRY_USB_HOST_USING_DEV0",
                  "CONFIG_CHERRY_USB_HOST_USING_DEV1",
                  "CONFIG_CHERRY_USB_HOST_ENABLE_CLASS_UVC",
                  "CONFIG_ENABLE_CANMV_USB_HOST",
                  "CONFIG_CANMV_USB_PWR_PIN",
                  "CONFIG_DWC2_DRV_DMA_DESC_ENABLE",
              },
              [
                  "CONFIG_ENABLE_CHERRY_USB_HOST=y",
                  "CONFIG_CHERRY_USB_HOST_USING_DEV0=y",
                  "CONFIG_CHERRY_USB_HOST_ENABLE_CLASS_UVC=y",
                  "CONFIG_CANMV_USB_PWR_PIN=-1",
                  "CONFIG_DWC2_DRV_DMA_DESC_ENABLE=y",
              ],
          )
          main = Path("src/rtsmart/rtsmart/kernel/bsp/maix3/app_canmv/main.c")
          text = main.read_text()
          init_guard = "#if defined (ENABLE_CHERRY_USB_HOST) && defined (ENABLE_CANMV_USB_HOST)"
          helper_guard = "#if defined(ENABLE_CHERRY_USB) && !defined(ENABLE_CHERRY_USB_OTG) && defined(ENABLE_CHERRY_USB_HOST) && defined(ENABLE_CANMV_USB_HOST)"
          if text.count(init_guard) != 1 or text.count(helper_guard) != 1:
              raise RuntimeError("unexpected USB host initialization guards")
          text = text.replace(init_guard, "#if defined (ENABLE_CHERRY_USB_HOST)")
          text = text.replace(
              helper_guard,
              "#if defined(ENABLE_CHERRY_USB) && !defined(ENABLE_CHERRY_USB_OTG) && defined(ENABLE_CHERRY_USB_HOST)",
          )
          async_end = dedent("""\
            return usbh_initialize(busid, reg_base);
          }
          #endif
          """)
          recovery_helpers = dedent("""\
            int ret = usbh_initialize(busid, reg_base);
            usbh_initialize_done = true;
            return ret;
          }

          #define USB_HOST_RECOVERY_RETRIES 2
          #define USB_HOST_CONNECT_WAIT_MS  5000
          #define DWC2_HPRT0_OFFSET         0x440
          #define DWC2_HPRT0_PCSTS          0x001

          static volatile bool usbh_initialize_done;
          static uint32_t usbh_recovery_reg_base;

          static void usbh_recovery_monitor_entry(void *parameter)
          {
            const uint32_t poll_ms = 500;
            (void)parameter;

            while (!usbh_initialize_done)
              rt_thread_mdelay(20);

            for (unsigned int attempt = 1; attempt <= USB_HOST_RECOVERY_RETRIES; ++attempt) {
              for (unsigned int waited = 0; waited < USB_HOST_CONNECT_WAIT_MS; waited += poll_ms) {
                uint32_t hprt0 = readl((void *)(uintptr_t)(usbh_recovery_reg_base + DWC2_HPRT0_OFFSET));
                if (hprt0 & DWC2_HPRT0_PCSTS) {
                  rt_kprintf("[usb-recovery] port connected, monitor exits; HPRT0=%08x\\n", hprt0);
                  return;
                }
                rt_thread_mdelay(poll_ms);
              }

              rt_kprintf("[usb-recovery] no physical connection; reinit %u/%u HPRT0=%08x\\n",
                         attempt, USB_HOST_RECOVERY_RETRIES,
                         readl((void *)(uintptr_t)(usbh_recovery_reg_base + DWC2_HPRT0_OFFSET)));
              usbh_initialize_done = false;
              usbh_deinitialize(0);
              rt_thread_mdelay(100);
              int ret = usbh_initialize(0, usbh_recovery_reg_base);
              usbh_initialize_done = true;
              rt_kprintf("[usb-recovery] reinit %u result=%d\\n", attempt, ret);
              if (ret < 0)
                return;
            }

            rt_kprintf("[usb-recovery] retry limit reached; leaving CherryUSB running for hot plug\\n");
          }

          static void usbh_start_recovery_monitor(uint32_t reg_base)
          {
            usbh_recovery_reg_base = reg_base;
            rt_thread_t tid = rt_thread_create("usbh_mon", usbh_recovery_monitor_entry, NULL,
                                               4096, RT_THREAD_PRIORITY_MAX - 2, 20);
            if (tid)
              rt_thread_startup(tid);
            else
              rt_kprintf("[usb-recovery] unable to create monitor thread\\n");
          }
          #endif
          """)
          if text.count(async_end) != 1:
              raise RuntimeError("unexpected async USB host helper")
          # The completion flag is referenced by both async entry paths.
          text = text.replace(
              "static struct usbh_initialize_async_arg usbh_initialize_async_args;",
              "static struct usbh_initialize_async_arg usbh_initialize_async_args;\nstatic volatile bool usbh_initialize_done;",
          )
          async_entry_call = "  usbh_initialize(arg->busid, arg->reg_base);"
          if text.count(async_entry_call) != 1:
              raise RuntimeError("unexpected async USB host entry")
          text = text.replace(
              async_entry_call,
              async_entry_call + "\n  usbh_initialize_done = true;",
          )
          recovery_helpers = recovery_helpers.replace("\nstatic volatile bool usbh_initialize_done;\n", "\n")
          text = text.replace(async_end, recovery_helpers)
          init_call = "  usbh_initialize_async(0, (uint32_t)(long)usb_base);"
          if text.count(init_call) != 1:
              raise RuntimeError("unexpected USB host init call")
          text = text.replace(
              init_call,
              init_call + "\n  usbh_start_recovery_monitor((uint32_t)(long)usb_base);",
          )
          main.write_text(text)

          hcd = Path("src/rtsmart/rtsmart/kernel/bsp/maix3/components/CherryUSB/port/dwc2/usb_hc_dwc2.c")
          text = hcd.read_text()
          drive_marker = "static inline uint8_t usbh_get_port_speed(struct usbh_bus *bus, const uint8_t port)"
          register_logger = dedent("""\
          static void dwc2_log_host_state(struct usbh_bus *bus, const char *event)
          {
              void *ctrl3_map = rt_ioremap((void *)(0x91585000UL + 0x7CUL), 0x1000);
              uint32_t ctrl3 = ctrl3_map ? readl(ctrl3_map) : 0xffffffffU;
              USB_LOG_WRN("[usb-host] %s USB0_CTRL3=%08x GUSBCFG=%08x GOTGCTL=%08x GRSTCTL=%08x HPRT0=%08x\\r\\n",
                          event, ctrl3, USB_OTG_GLB->GUSBCFG, USB_OTG_GLB->GOTGCTL,
                          USB_OTG_GLB->GRSTCTL, USB_OTG_HPRT);
              if (ctrl3_map)
                  rt_iounmap(ctrl3_map);
          }

          """)
          if text.count(drive_marker) != 1:
              raise RuntimeError("unexpected DWC2 speed helper")
          text = text.replace(drive_marker, register_logger + drive_marker)
          reset_start = dedent("""\
          static int usbh_reset_port(struct usbh_bus *bus, const uint8_t port)
          {
              __IO uint32_t hprt0 = 0U;
          """)
          if text.count(reset_start) != 1:
              raise RuntimeError("unexpected DWC2 port reset helper")
          text = text.replace(
              reset_start,
              reset_start + '    USB_LOG_WRN("[usb-host] port %u reset begin HPRT0=%08x\\r\\n", port, USB_OTG_HPRT);\n',
          )
          init_return = dedent("""\
              USB_OTG_GLB->GAHBCFG |= USB_OTG_GAHBCFG_GINT;

              return ret;
          }
          """)
          if text.count(init_return) != 1:
              raise RuntimeError("unexpected DWC2 init return")
          text = text.replace(
              init_return,
              dedent("""\
              USB_OTG_GLB->GAHBCFG |= USB_OTG_GAHBCFG_GINT;

              dwc2_log_host_state(bus, "initialized");
              return ret;
          }
          """),
          )
          connect_irq = """\
                  if ((hprt0 & USB_OTG_HPRT_PCSTS) == USB_OTG_HPRT_PCSTS) {
                      bus->hcd.roothub.int_buffer[0] = (1 << 1);
          """
          if text.count(connect_irq) != 1:
              raise RuntimeError("unexpected DWC2 connect IRQ")
          text = text.replace(
              connect_irq,
              """\
                  if ((hprt0 & USB_OTG_HPRT_PCSTS) == USB_OTG_HPRT_PCSTS) {
                      USB_LOG_WRN("[usb-host] physical connect HPRT0=%08x\\r\\n", hprt0);
                      bus->hcd.roothub.int_buffer[0] = (1 << 1);
          """,
          )
          disconnect_irq = """\
                  if (gint_status & USB_OTG_GINTSTS_DISCINT) {
                      g_dwc2_hcd[bus->hcd.hcd_id].port_csc = 1;
          """
          if text.count(disconnect_irq) != 1:
              raise RuntimeError("unexpected DWC2 disconnect IRQ")
          text = text.replace(
              disconnect_irq,
              """\
                  if (gint_status & USB_OTG_GINTSTS_DISCINT) {
                      USB_LOG_WRN("[usb-host] physical disconnect HPRT0=%08x\\r\\n", USB_OTG_HPRT);
                      g_dwc2_hcd[bus->hcd.hcd_id].port_csc = 1;
          """,
          )
          hcd.write_text(text)

          hub = Path("src/rtsmart/rtsmart/kernel/bsp/maix3/components/CherryUSB/class/hub/usbh_hub.c")
          text = hub.read_text()
          enum_success = """\
                                  ret = usbh_enumerate(child);
                                  if (ret >= 0)
                                      break;
          """
          if text.count(enum_success) != 1:
              raise RuntimeError("unexpected CherryUSB enumerate loop")
          text = text.replace(
              enum_success,
              """\
                                  ret = usbh_enumerate(child);
                                  if (ret >= 0) {
                                      USB_LOG_WRN("[usb-host] enumerated VID:PID %04x:%04x addr=%u\\r\\n",
                                                  child->device_desc.idVendor, child->device_desc.idProduct,
                                                  child->dev_addr);
                                      break;
                                  }
          """,
          )
          text = text.replace(
              'USB_LOG_INFO("Device on Bus %u, Hub %u, Port %u disconnected\\r\\n", hub->bus->busid, hub->index, port + 1);',
              'USB_LOG_WRN("[usb-host] device disconnected Bus %u Hub %u Port %u\\r\\n", hub->bus->busid, hub->index, port + 1);',
          )
          hub.write_text(text)

          video = Path("src/rtsmart/rtsmart/kernel/bsp/maix3/components/CherryUSB/class/video/usbh_video.c")
          text = video.read_text()
          text = text.replace(
              'USB_LOG_INFO("Register Video Class:%s\\r\\n", hport->config.intf[intf].devname);',
              'USB_LOG_WRN("[usb-host] UVC bound: %s\\r\\n", hport->config.intf[intf].devname);',
          )
          text = text.replace(
              'USB_LOG_INFO("Unregister Video Class:%s\\r\\n", hport->config.intf[intf].devname);',
              'USB_LOG_WRN("[usb-host] UVC unbound: %s\\r\\n", hport->config.intf[intf].devname);',
          )
          video.write_text(text)

          csc = Path("src/canmv/port/modules/modnonai2d.csc.c")
          text = csc.read_text()
          replacements = {
              "// py_nonai_2d_csc_obj_t* o = m_new_obj_with_finaliser(py_nonai_2d_csc_obj_t);\n    py_nonai_2d_csc_obj_t* o = malloc(sizeof(py_nonai_2d_csc_obj_t));": "py_nonai_2d_csc_obj_t* o = m_new_obj_with_finaliser(py_nonai_2d_csc_obj_t);",
              "o->_cobj.is_destroyed = 0;\n    INIT_LIST_HEAD(&o->_cobj.frame_vf_info_list);": "o->_cobj.is_destroyed = 0;\n    o->_cobj.cvt_vf_info_obj = mp_const_none;\n    INIT_LIST_HEAD(&o->_cobj.frame_vf_info_list);",
              "pthread_mutex_init(&o->_cobj.mutex, &thread_mutex_attr);": "pthread_mutex_init(&o->_cobj.mutex, &thread_mutex_attr);\n    pthread_mutexattr_destroy(&thread_mutex_attr);",
              "mp_obj_t to_image_func;": "mp_obj_t to_image_method[2];",
              "mp_load_method(dumped_vf_video_frame_obj, MP_QSTR_to_image, &to_image_func);": "mp_load_method(dumped_vf_video_frame_obj, MP_QSTR_to_image, to_image_method);",
              "mp_obj_is_callable(to_image_func)": "mp_obj_is_callable(to_image_method[0])",
              "to_image_func, // func": "to_image_method[0], // func",
              "dumped_vf_video_frame_obj, // self": "to_image_method[1], // self",
              "list_del(&obj->list);\n    free(obj);": "list_del(&obj->list);\n    INIT_LIST_HEAD(&obj->list);",
              "// { MP_ROM_QSTR(MP_QSTR___del__), MP_ROM_PTR(&py_nonai_2d_csc_destroy_obj) },": "{ MP_ROM_QSTR(MP_QSTR___del__), MP_ROM_PTR(&py_nonai_2d_csc_destroy_obj) },",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise RuntimeError(f"unexpected CSC implementation for: {old}")
              text = text.replace(old, new)
          csc.write_text(text)

          for relative in (
              "src/canmv/port/modules/modmedia.videoframe.c",
              "src/canmv/port/modules/modmedia.uvc.c",
          ):
              path = Path(relative)
              text = path.read_text()
              old = "image_t               image;" if "videoframe" in relative else "image_t          image;"
              new = old[:-1] + " = { 0 };"
              if text.count(old) != 1:
                  raise RuntimeError(f"unexpected uninitialized image_t in {relative}")
              path.write_text(text.replace(old, new))
          PY

      - name: Download RT-Smart toolchain
        working-directory: canmv_v18
        run: make dl_toolchain TOOLCHAIN=rtsmart

      - name: Build and assert dedicated-host configuration
        working-directory: canmv_v18
        env:
          IS_CI: "1"
          SKIP_TOOLCHAIN_CHECK: "1"
        run: |
          source "$HOME/.canmv_venv/bin/activate"
          make k230d_canmv_atk_dnk230d_defconfig
          grep -qx 'CONFIG_ENABLE_UVC_CAMERA=y' .config
          grep -qx 'CONFIG_USBHOST_MAX_VIDEO_CLASS=1' .config
          rt_defconfig=src/rtsmart/rtsmart/kernel/bsp/maix3/configs/k230d_canmv_atk_dnk230d_defconfig
          grep -qx 'CONFIG_ENABLE_CHERRY_USB_HOST=y' "$rt_defconfig"
          grep -qx 'CONFIG_CHERRY_USB_HOST_USING_DEV0=y' "$rt_defconfig"
          grep -qx 'CONFIG_CHERRY_USB_HOST_ENABLE_CLASS_UVC=y' "$rt_defconfig"
          grep -qx 'CONFIG_CANMV_USB_PWR_PIN=-1' "$rt_defconfig"
          ! grep -q '^CONFIG_ENABLE_CANMV_USB_HOST=y' "$rt_defconfig"
          ! grep -q '^CONFIG_ENABLE_CHERRY_USB_OTG=y' "$rt_defconfig"
          ! grep -q '^CONFIG_ENABLE_CHERRY_USB_DEVICE=y' "$rt_defconfig"
          grep -q '^#if defined (ENABLE_CHERRY_USB_HOST)$' src/rtsmart/rtsmart/kernel/bsp/maix3/app_canmv/main.c
          grep -q '^#if defined(ENABLE_CHERRY_USB) && !defined(ENABLE_CHERRY_USB_OTG) && defined(ENABLE_CHERRY_USB_HOST)$' src/rtsmart/rtsmart/kernel/bsp/maix3/app_canmv/main.c
          grep -q 'USB_HOST_RECOVERY_RETRIES 2' src/rtsmart/rtsmart/kernel/bsp/maix3/app_canmv/main.c
          grep -q 'usbh_start_recovery_monitor' src/rtsmart/rtsmart/kernel/bsp/maix3/app_canmv/main.c
          grep -q 'USB0_CTRL3=%08x GUSBCFG=%08x GOTGCTL=%08x GRSTCTL=%08x HPRT0=%08x' src/rtsmart/rtsmart/kernel/bsp/maix3/components/CherryUSB/port/dwc2/usb_hc_dwc2.c
          grep -q '\[usb-host\] enumerated VID:PID' src/rtsmart/rtsmart/kernel/bsp/maix3/components/CherryUSB/class/hub/usbh_hub.c
          grep -q '\[usb-host\] UVC bound' src/rtsmart/rtsmart/kernel/bsp/maix3/components/CherryUSB/class/video/usbh_video.c
          grep -q 'mp_obj_t to_image_method\[2\];' src/canmv/port/modules/modnonai2d.csc.c
          grep -q 'mp_load_method(dumped_vf_video_frame_obj, MP_QSTR_to_image, to_image_method);' src/canmv/port/modules/modnonai2d.csc.c
          ! grep -q 'mp_obj_t to_image_func;' src/canmv/port/modules/modnonai2d.csc.c
          grep -q 'm_new_obj_with_finaliser(py_nonai_2d_csc_obj_t)' src/canmv/port/modules/modnonai2d.csc.c
          ! grep -q 'py_nonai_2d_csc_obj_t\* o = malloc' src/canmv/port/modules/modnonai2d.csc.c
          ! grep -q 'free(obj);' src/canmv/port/modules/modnonai2d.csc.c
          grep -q 'image_t               image = { 0 };' src/canmv/port/modules/modmedia.videoframe.c
          grep -q 'image_t          image = { 0 };' src/canmv/port/modules/modmedia.uvc.c
          time make -j8
          test -n "$(find output -type f -name '*.img' -print -quit)"

      - name: Verify post-build source patches
        working-directory: canmv_v18
        run: |
          grep -q 'mp_obj_t to_image_method\[2\];' src/canmv/port/modules/modnonai2d.csc.c
          grep -q 'm_new_obj_with_finaliser(py_nonai_2d_csc_obj_t)' src/canmv/port/modules/modnonai2d.csc.c
          ! grep -q 'py_nonai_2d_csc_obj_t\* o = malloc' src/canmv/port/modules/modnonai2d.csc.c
          ! grep -q 'free(obj);' src/canmv/port/modules/modnonai2d.csc.c
          grep -q 'image_t               image = { 0 };' src/canmv/port/modules/modmedia.videoframe.c
          grep -q 'image_t          image = { 0 };' src/canmv/port/modules/modmedia.uvc.c

      - name: Collect image and resolved configs
        if: always()
        working-directory: canmv_v18
        run: |
          mkdir -p codex_force_host_artifact
          find output -type f \( -name '*.img' -o -name '*.img.gz' -o -name '*.md5' \) \
            -exec cp -v '{}' codex_force_host_artifact/ \; 2>/dev/null || true
          cp -v configs/k230d_canmv_atk_dnk230d_defconfig codex_force_host_artifact/top_defconfig.txt
          cp -v src/rtsmart/rtsmart/kernel/bsp/maix3/configs/k230d_canmv_atk_dnk230d_defconfig \
            codex_force_host_artifact/rtsmart_defconfig.txt
          cp -v resolved_manifest.xml codex_force_host_artifact/
          find codex_force_host_artifact -maxdepth 1 -type f -printf '%f %s bytes\n'

      - name: Upload firmware artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atk-dnk230d-canmv-v1.8-forced-usb0-uvc-host
          path: canmv_v18/codex_force_host_artifact/
          if-no-files-found: error
          retention-days: 3
